spring.application.name=intellistock
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/intellistock}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:intellistock}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:intellistock}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway — disabled while using ddl-auto=update for dev; re-enable for production
spring.flyway.enabled=false

# JWT — required, no default. Generate one with: openssl rand -hex 32
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Mail (Gmail SMTP — set MAIL_USERNAME and MAIL_PASSWORD in .env)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=8080

# App URLs (used for eSewa redirect callbacks)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# eSewa ePay v2 — sandbox defaults; override for production
esewa.product-code=${ESEWA_PRODUCT_CODE:EPAYTEST}
esewa.secret-key=${ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}
esewa.form-url=${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
esewa.pro-price=${ESEWA_PRO_PRICE:1000}
